[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-rl"
version = "0.1.0"
description = "Full MaleCNS connectome reservoir controlling a virtual fly"
requires-python = ">=3.11"
dependencies = ["torch==2.7.1", "numpy", "scipy", "pyarrow", "requests", "gymnasium>=0.29,<1.3", "stable-baselines3==2.7.0", "panda3d==1.10.16", "tensorboard", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "pillow"]

[project.scripts]
fly-rl = "fly_rl.cli:main"

[tool.setuptools.packages.find]
include = ["fly_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
